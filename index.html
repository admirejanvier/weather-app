<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weather</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-sky="clear-day">
  <main class="app">
    <form id="searchForm" class="search" role="search">
      <label for="cityInput" class="sr">City</label>
      <input id="cityInput" type="search" placeholder="City, or City, Country" autocomplete="off" required minlength="2">
      <button type="submit">Search</button>
      <button type="button" id="locateBtn" aria-label="Use my location" title="Use my location">📍</button>
    </form>

    <p id="status" role="status" aria-live="polite">Search for a city or use your location.</p>
    <ul id="matches" class="matches" aria-label="Other matching places" hidden></ul>

    <section id="weather" hidden>
      <header>
        <h1 id="place"></h1>
        <p id="localTime"></p>
      </header>
      <div class="now">
        <span id="icon" aria-hidden="true"></span>
        <span id="temp"></span>
      </div>
      <p id="desc" class="desc"></p>
      <dl class="facts">
        <div><dt>Feels like</dt><dd id="feels"></dd></div>
        <div><dt>Humidity</dt><dd id="humidity"></dd></div>
        <div><dt>Wind</dt><dd id="wind"></dd></div>
        <div><dt>Rain today</dt><dd id="rain"></dd></div>
      </dl>
      <ol id="forecast" class="forecast" aria-label="5-day forecast"></ol>
      <button id="unitBtn" type="button" class="unit"></button>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
